<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Devyani Azure Hub-Spoke Architecture</title>
  <desc id="desc">Azure hub network peered with dev and production spokes, including gateway, firewall, bastion, app services, PostgreSQL, identity, Key Vault, and centralized monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526579"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #526579; }
      .boundary { fill: #f8fafc; stroke: #61758a; stroke-width: 2; }
      .hub { fill: #eff6ff; stroke: #2563eb; }
      .dev { fill: #f0fdf4; stroke: #16a34a; }
      .prod { fill: #fff7ed; stroke: #ea580c; }
      .shared { fill: #f5f3ff; stroke: #7c3aed; }
      .card { fill: #ffffff; stroke: #9aabba; stroke-width: 1.5; rx: 9; }
      .card-blue { fill: #eff6ff; stroke: #60a5fa; }
      .card-green { fill: #f0fdf4; stroke: #4ade80; }
      .card-orange { fill: #fff7ed; stroke: #fb923c; }
      .card-purple { fill: #f5f3ff; stroke: #a78bfa; }
      .group-title { font-size: 19px; font-weight: 700; }
      .group-sub { font-size: 12px; fill: #526579; }
      .node-title { font-size: 14px; font-weight: 700; }
      .node-sub { font-size: 11px; fill: #526579; }
      .flow { fill: none; stroke: #526579; stroke-width: 2; marker-end: url(#arrow); }
      .appflow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .peering { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 8 6; }
      .monitor { fill: none; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 4 5; marker-end: url(#arrow); }
      .label { font-size: 11px; fill: #34495e; }
      .legend { font-size: 12px; fill: #34495e; }
    </style>
  </defs>

  <rect width="1440" height="940" fill="#ffffff"/>
  <text x="48" y="50" class="title">Devyani Azure Hub-Spoke Architecture</text>
  <text x="48" y="76" class="subtitle">Terraform-defined network, application, database, security, and monitoring resources</text>

  <!-- Internet entry -->
  <rect x="290" y="102" width="270" height="58" class="card card-blue"/>
  <text x="425" y="127" text-anchor="middle" class="node-title">Internet users</text>
  <text x="425" y="146" text-anchor="middle" class="node-sub">Public entry point (as configured)</text>
  <path d="M425 160 L425 270" class="appflow"/>

  <!-- Hub boundary -->
  <rect x="250" y="195" width="940" height="220" rx="18" class="boundary hub"/>
  <text x="278" y="229" class="group-title">HUB VNet · rg-hub · 10.0.0.0/16</text>
  <text x="278" y="249" class="group-sub">Shared ingress, egress security, administration, and connectivity</text>

  <rect x="300" y="276" width="250" height="88" class="card card-blue"/>
  <text x="425" y="306" text-anchor="middle" class="node-title">Application Gateway + WAF</text>
  <text x="425" y="327" text-anchor="middle" class="node-sub">Public IP · OWASP policy · path routing</text>
  <text x="425" y="346" text-anchor="middle" class="node-sub">HTTPS listener/certificate needs configuration</text>

  <rect x="595" y="276" width="250" height="88" class="card"/>
  <text x="720" y="306" text-anchor="middle" class="node-title">Azure Firewall</text>
  <text x="720" y="327" text-anchor="middle" class="node-sub">Firewall policy and network/application rules</text>
  <text x="720" y="346" text-anchor="middle" class="node-sub">Spoke default routes point here</text>

  <rect x="890" y="276" width="250" height="88" class="card"/>
  <text x="1015" y="306" text-anchor="middle" class="node-title">Azure Bastion</text>
  <text x="1015" y="327" text-anchor="middle" class="node-sub">Administrative access through hub subnet</text>
  <text x="1015" y="346" text-anchor="middle" class="node-sub">No direct VM resource defined in this file set</text>

  <!-- VNet peering connectors -->
  <path d="M425 415 C425 450 345 450 345 480" class="peering"/>
  <path d="M1015 415 C1015 450 1095 450 1095 480" class="peering"/>
  <text x="352" y="451" class="label">VNet peering</text>
  <text x="1019" y="451" class="label">VNet peering</text>

  <!-- Dev spoke -->
  <rect x="48" y="480" width="650" height="330" rx="18" class="boundary dev"/>
  <text x="76" y="515" class="group-title">DEV SPOKE · rg-dev · 10.20.0.0/16</text>
  <text x="76" y="535" class="group-sub">Separate app and data subnets · environment defaults in variables.tf</text>

  <rect x="80" y="560" width="270" height="78" class="card card-green"/>
  <text x="215" y="588" text-anchor="middle" class="node-title">Frontend App Service</text>
  <text x="215" y="610" text-anchor="middle" class="node-sub">dev-frontend-app · Node.js 18</text>
  <rect x="390" y="560" width="270" height="78" class="card card-green"/>
  <text x="525" y="588" text-anchor="middle" class="node-title">Backend App Service</text>
  <text x="525" y="610" text-anchor="middle" class="node-sub">dev-backend-app · Python 3.11</text>
  <path d="M350 599 L385 599" class="appflow"/>
  <text x="367" y="585" text-anchor="middle" class="label">HTTPS</text>
  <path d="M425 364 C345 430 215 455 215 555" class="appflow"/>
  <text x="276" y="460" class="label">WAF routes to dev</text>

  <rect x="390" y="675" width="270" height="78" class="card card-green"/>
  <text x="525" y="703" text-anchor="middle" class="node-title">PostgreSQL Flexible Server</text>
  <text x="525" y="725" text-anchor="middle" class="node-sub">devdb · private DNS · SSL required</text>
  <path d="M525 638 L525 670" class="appflow"/>
  <text x="540" y="660" class="label">TCP 5432</text>

  <rect x="80" y="675" width="270" height="78" class="card card-purple"/>
  <text x="215" y="703" text-anchor="middle" class="node-title">Identity + Key Vault</text>
  <text x="215" y="725" text-anchor="middle" class="node-sub">Managed identity · secret access</text>

  <!-- Prod spoke -->
  <rect x="742" y="480" width="650" height="330" rx="18" class="boundary prod"/>
  <text x="770" y="515" class="group-title">PROD SPOKE · rg-prod · 10.10.0.0/16</text>
  <text x="770" y="535" class="group-sub">Separate app and data subnets · higher availability defaults</text>

  <rect x="774" y="560" width="270" height="78" class="card card-orange"/>
  <text x="909" y="588" text-anchor="middle" class="node-title">Frontend App Service</text>
  <text x="909" y="610" text-anchor="middle" class="node-sub">prod-frontend-app · Node.js 18</text>
  <rect x="1084" y="560" width="270" height="78" class="card card-orange"/>
  <text x="1219" y="588" text-anchor="middle" class="node-title">Backend App Service</text>
  <text x="1219" y="610" text-anchor="middle" class="node-sub">prod-backend-app · Python 3.11</text>
  <path d="M1044 599 L1079 599" class="appflow"/>
  <text x="1061" y="585" text-anchor="middle" class="label">HTTPS</text>
  <path d="M450 364 C670 440 909 440 909 555" class="appflow"/>
  <text x="674" y="460" class="label">WAF routes to prod</text>

  <rect x="1084" y="675" width="270" height="78" class="card card-orange"/>
  <text x="1219" y="703" text-anchor="middle" class="node-title">PostgreSQL Flexible Server</text>
  <text x="1219" y="725" text-anchor="middle" class="node-sub">proddb · private DNS · SSL + HA</text>
  <path d="M1219 638 L1219 670" class="appflow"/>
  <text x="1234" y="660" class="label">TCP 5432</text>

  <rect x="774" y="675" width="270" height="78" class="card card-purple"/>
  <text x="909" y="703" text-anchor="middle" class="node-title">Identity + Key Vault</text>
  <text x="909" y="725" text-anchor="middle" class="node-sub">Managed identity · purge protection</text>

  <text x="76" y="790" class="node-sub">Subnets: frontend · backend · delegated appservice · delegated database | NSGs on frontend/backend/database</text>
  <text x="770" y="790" class="node-sub">Subnets: frontend · backend · delegated appservice · delegated database | NSGs on frontend/backend/database</text>

  <!-- Shared services / monitoring -->
  <rect x="250" y="842" width="940" height="70" rx="14" class="boundary shared"/>
  <text x="720" y="870" text-anchor="middle" class="node-title">Shared operations in Devyani-RG</text>
  <text x="720" y="892" text-anchor="middle" class="node-sub">Central Log Analytics · per-environment Application Insights · diagnostic settings for key services</text>
  <path d="M215 753 C215 820 420 820 420 837" class="monitor"/>
  <path d="M909 753 C909 820 1020 820 1020 837" class="monitor"/>

  <!-- Legend -->
  <line x1="60" y1="880" x2="100" y2="880" class="appflow"/>
  <text x="110" y="884" class="legend">Application/data flow</text>
  <line x1="60" y1="907" x2="100" y2="907" class="peering"/>
  <text x="110" y="911" class="legend">VNet peering</text>
</svg>
